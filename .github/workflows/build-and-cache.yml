name: build and cache

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [ master ]
    paths:
      - '**.nix'
      - 'flake.lock'
      - 'assets/**'
      - '.github/workflows/**'
  push:
    branches: [ master ]
    paths:
      - '**.nix'
      - 'flake.lock'
      - 'assets/**'
      - '.github/workflows/**'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        shell: bash -euo pipefail {0}
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v16
        with:
          extra-conf: |
            accept-flake-config = true

      - name: Setup Cachix
        uses: cachix/cachix-action@v15
        with:
          name: neonvoidx
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Restore substituters
        run: echo "NIX_USER_CONF_FILES=${NIX_USER_CONF_FILES}:/etc/nix/nix.conf" >> "$GITHUB_ENV"

      - name: Check
        run: nix flake check -L

      - name: Build and cache void
        run: |
          cachix watch-exec neonvoidx -- \
            nix build .#nixosConfigurations.void.config.system.build.toplevel \
            --no-link -L --option max-jobs 1

      - name: Build and cache voidframe
        run: |
          cachix watch-exec neonvoidx -- \
            nix build .#nixosConfigurations.voidframe.config.system.build.toplevel \
            --no-link -L --option max-jobs 1
