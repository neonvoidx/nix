name: build and cache

on:
  pull_request:
    branches: [ master ]
    paths:
      - '**.nix'
      - 'flake.lock'
      - 'assets/**'
  push:
    branches: [ master ]
    paths:
      - '**.nix'
      - 'flake.lock'
      - 'assets/**'

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        shell: bash -euo pipefail {0}
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.0
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Nix cache config
        id: cache-config
        run: |
          python3 - <<'EOF'
          import re, os

          with open('modules/nix/settings.nix') as f:
              content = f.read()

          def extract_list(name):
              m = re.search(rf'{name}\s*=\s*\[(.*?)\];', content, re.DOTALL)
              if not m: return ''
              return ' '.join(re.findall(r'"([^"]+)"', m.group(1)))

          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f"substituters={extract_list('substituters')}\n")
              out.write(f"trusted-public-keys={extract_list('trusted-public-keys')}\n")
          EOF

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v16
        with:
          extra-conf: |
            substituters = ${{ steps.cache-config.outputs.substituters }}
            trusted-public-keys = ${{ steps.cache-config.outputs.trusted-public-keys }}

      - name: Nix flake check
        run: nix flake check -L

  build:
    runs-on: ubuntu-latest
    needs: check
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        shell: bash -euo pipefail {0}
    strategy:
      matrix:
        host: [void, voidframe]
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.0
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Nix cache config
        id: cache-config
        run: |
          python3 - <<'EOF'
          import re, os

          with open('modules/nix/settings.nix') as f:
              content = f.read()

          def extract_list(name):
              m = re.search(rf'{name}\s*=\s*\[(.*?)\];', content, re.DOTALL)
              if not m: return ''
              return ' '.join(re.findall(r'"([^"]+)"', m.group(1)))

          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f"substituters={extract_list('substituters')}\n")
              out.write(f"trusted-public-keys={extract_list('trusted-public-keys')}\n")
          EOF

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v16
        with:
          extra-conf: |
            substituters = ${{ steps.cache-config.outputs.substituters }}
            trusted-public-keys = ${{ steps.cache-config.outputs.trusted-public-keys }}

      - name: Cache Nix store
        uses: nix-community/cache-nix-action@v6
        with:
          primary-key: nix-${{ runner.os }}-${{ matrix.host }}-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ matrix.host }}-
          gc-max-store-size-linux: 8G

      - name: Set up Cachix
        uses: cachix/cachix-action@v15
        with:
          name: neonvoidx
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build ${{ matrix.host }}
        run: |
          nix build .#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel \
            --no-link -L
