[effects.preset.orbit]
kind = "border"
shader = "shader.glsl"
palette = true
# Controls the stationary border fade through the shader's draw area.
# 12 reaches about 7 logical pixels with this border; keep at least 8 for the orbit.
padding = 12
# The shader travels 100 logical pixels/s per 1.0; 3.3 gives 330 pixels/s.
speed = 6.0

[effects.preset.orbit.light]
spread = 24
intensity = 2.2
threshold = 0.75
