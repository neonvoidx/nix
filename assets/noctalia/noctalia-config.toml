[audio]
enable_overdrive = false
enable_sounds = false

[bar.main]
capsule = true
capsule_foreground = "tertiary"
capsule_groups = [ "system", "audio", "settings", "datetime" ]
center = [ "active_window", "weather" ]
contact_shadow = true
end = [
    "tray",
    "input_volume",
    "output_volume",
    "cpu",
    "ram",
    "temp",
    "network_rx",
    "network_tx",
    "battery",
    "caffeine",
    "recorder",
    "bluetooth",
    "brightness",
    "wallpaper",
    "control-center",
    "notifications",
    "clock",
    "date",
    "session"
]
font_weight = 700
margin_edge = 5.0
margin_ends = 8.0
padding = 10
radius = 8
start = [ "launcher", "workspaces", "taskbar", "left-spacer", "media", "audio_visualizer", "cat" ]
thickness = 38
widget_spacing = 12

    [bar.main.monitor.HDMI-A-1]
    enabled = false
    reserve_space = false

[calendar]
enabled = true

    [calendar.account.personal_google]
    name = "Personal Calendar"
    type = "google"

[desktop_widgets]
enabled = false

[dock]
active_monitor_only = true
icon_size = 38
launcher_icon = "bomb"
launcher_position = "start"
monitors = [ "DP-2", "DP-3" ]
show_dots = true

[idle]
behavior_order = [ "lock", "screen-off", "suspend" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 600

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 900

    [idle.behavior.suspend]
    action = "suspend"
    enabled = true
    lock_before_suspend = true
    timeout = 7200

[location]
address = "Hooksett, NH"
auto_locate = false

[lockscreen_widgets]
