[notification]
monitors = [ "DP-2", "DP-3" ]

[osd]
position = "top_center"
scale = 1.1000000089406967

[plugin_settings."noctalia/screen_recorder"]
color_range = "full"
directory = ""

[plugins]
enabled = [ "noctalia/bongocat", "noctalia/screen_recorder" ]

[shell]
avatar_path = "/home/neonvoid/.face"
font_family = "NeonMono"
lang = "en"
launch_apps_as_systemd_services = true
polkit_agent = true
screen_time_enabled = true
settings_show_advanced = true
ui_scale = 1.1000000089406967

    [shell.greeter_sync]
    auto_sync = false

    [shell.panel]
    borders = true
    control_center_placement = "floating"
    open_near_click_control_center = true
    session_placement = "floating"
    session_position = "center"
    wallpaper_placement = "centered"

    [[shell.session.actions]]
    action = "lock"
    enabled = true
    shortcut = "x"
    variant = "primary"

    [[shell.session.actions]]
    action = "command"
    command = "/etc/profiles/per-user/neonvoid/bin/hyprshutdown"
    enabled = true
    glyph = "logout"
    label = "Logout"
    shortcut = "l"
    variant = "secondary"

    [[shell.session.actions]]
    action = "lock_and_suspend"
    enabled = true
    label = "Lock & Suspend"
    shortcut = "h"
    variant = "outline"

    [[shell.session.actions]]
    action = "suspend"
    enabled = false
    shortcut = "h"
    variant = "default"

    [[shell.session.actions]]
    action = "reboot"
    enabled = true
    shortcut = "r"
    variant = "destructive"

    [[shell.session.actions]]
    action = "shutdown"
    enabled = true
    shortcut = "s"
    variant = "destructive"

[theme]
builtin = "Eldritch"
community_palette = "Oxocarbon"
mode = "dark"
source = "builtin"

[wallpaper]
directory = "/home/neonvoid/pics/ultrawide"
directory_dark = "/home/neonvoid/pics/ultrawide"
directory_light = "/home/neonvoid/pics/ultrawide"
per_monitor_directories = true
transition = [ "honeycomb" ]
transition_on_startup = true

    [wallpaper.automation]
    enabled = true
    interval_minutes = 5
    recursive = false

    [wallpaper.monitor.DP-2]
    directory = "/home/neonvoid/pics/ultrawide"
    directory_dark = "/home/neonvoid/pics/ultrawide"
    directory_light = "/home/neonvoid/pics/ultrawide"

    [wallpaper.monitor.DP-3]
    directory = "/home/neonvoid/pics/ultrawide"
    directory_dark = "/home/neonvoid/pics/ultrawide"
    directory_light = "/home/neonvoid/pics/ultrawide"

    [wallpaper.monitor.HDMI-A-1]
    directory = "/home/neonvoid/pics/vertical"
    directory_dark = "/home/neonvoid/pics/vertical"
    directory_light = "/home/neonvoid/pics/vertical"

[weather]
auto_locate = true
unit = "imperial"

[widget.active_window]
color = "primary"
icon_size = 22.0
max_length = 320.0
title_scroll = "always"

[widget.audio_visualizer]
capsule = true
capsule_group = "audio"
high_color = "secondary"
show_when_idle = true
width = 112.0

[widget.battery]
capsule = true
capsule_group = "system"

[widget.bluetooth]
capsule = true
capsule_group = "settings"

[widget.bongocat]
audio_spectrum = false
input_device = "/dev/input/event2"
scope = "shared"
script = "scripts/bongocat.lua"
tappy_mode = true
type = "scripted"

[widget.brightness]
capsule = true
capsule_group = "settings"

[widget.caffeine]
capsule = true
capsule_group = "settings"

[widget.cat]
input_device = "/dev/input/event2"
type = "noctalia/bongocat:cat"

[widget.clock]
capsule = true
capsule_foreground = "primary"
capsule_group = "datetime"

[widget.control-center]
capsule = true
capsule_group = "settings"

[widget.cpu]
capsule = true
capsule_group = "system"

[widget.date]
capsule = true
capsule_foreground = "primary"
capsule_group = "datetime"
format = "{:%d %b %Y}"

[widget.input_volume]
capsule = true
capsule_group = "audio"

[widget.launcher]
color = "primary"
glyph = "bomb"

[widget.left-spacer]
length = 25
type = "spacer"

[widget.media]
art_size = 56.0
capsule = true
capsule_foreground = "secondary"
capsule_group = "audio"
hide_when_no_media = true
max_length = 350.0
title_scroll = "always"

[widget.network_rx]
capsule = true
capsule_group = "system"

[widget.network_tx]
capsule = true
capsule_group = "system"

[widget.notifications]
capsule = true
capsule_group = "settings"

[widget.output_volume]
capsule = true
capsule_group = "audio"

[widget.ram]
capsule = true
capsule_group = "system"

[widget.recorder]
type = "noctalia/screen_recorder:recorder"

[widget.screen_recorder]
capsule = true
capsule_group = "settings"
script = "scripts/screen_recorder.lua"
type = "scripted"

[widget.session]
color = "error"

[widget.taskbar]
capsule_radius = 6
font_weight = 700
group_by_workspace = true
group_single_icon_per_app = true
inactive_opacity = 0.75
scale = 1.3
show_workspace_label = true
workspace_label_placement = "inside"

[widget.temp]
capsule = true
capsule_group = "system"

[widget.tray]
capsule = true
capsule_border = "tertiary"
capsule_radius = 5
scale = 1.3

[widget.wallpaper]
capsule = true
capsule_group = "settings"

[widget.workspaces]
display = "none"
empty_color = "shadow"
font_weight = 700
minimal = false
pill_scale = 0.80000000000000004
scale = 1.3500000000000001
