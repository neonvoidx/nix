  - &admin_neonvoid age1p7jngse0vtfer554m7kq6dxkakfr5hpkl4sel4hfz3elpm0mmuxqcjcj6r

  # Per-machine standalone age key for boot-time decryption via sops-nix systemd service
  # Generated with: age-keygen -o /etc/sops/age/key.txt
  - &void_boot age1r8cvtvgpr7vem7w93q4v06wt6f8rfuchkhgk0yqnllvaktc35dcqp4l7n3

creation_rules:
